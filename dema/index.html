<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>Dema Intelligence Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<!--css-->
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/room.css">
<link rel="stylesheet" href="css/erp.css">
<link rel="stylesheet" href="css/systems.css">
<!--/css-->
<!--/page-head-->
</head>
<body>
<!--page-body-->
<div id="app">
  <header class="topbar">
    <a class="brand" href="#map" aria-label="Dema Intelligence Room, go to map">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">Dema</span>
      <span class="brand-sub">Intelligence Room</span>
    </a>
    <nav class="nav" aria-label="Views">
      <a href="#map" data-view="map">Business map</a>
      <a href="#room" data-view="room">Production room</a>
      <a href="#erp" data-view="erp">ERP</a>
      <a href="#systems" data-view="systems">Systems</a>
    </nav>
    <div class="topbar-end">
      <span class="pill pill-info demo-flag" title="Every figure here is example data until Dema's real feeds are connected">Example data</span>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch between light and dark">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 0 15z" fill="currentColor"/><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
<!--/page-body-->
</body>
</html>
